<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DECS Login</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .login-box {
      width: 380px;
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      text-align: center;
    }

    img {
      width: 180px;
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #cfcfcf;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #79d69a;
      color: #111;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #68c587;
    }

    .error {
      color: #d62828;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="DECS Logo">

    <h2>DECS Login</h2>

    <form method="POST">
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
